version: '3.8'

services:
  db:
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: rust_api_template
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: rust_api_template:latest
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      - db
    ports:
      - "8080:8080"
    environment:
      # If your app reads DATABASE_URL or other env vars, keep them in .env
      # Example override (comment out if you use .env):
      # DATABASE_URL: postgres://postgres:postgres@db:5432/rust_api_template
      RUST_LOG: info

volumes:
  db_data: {}

